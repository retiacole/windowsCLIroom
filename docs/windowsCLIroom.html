  const ok = (stdout, effects) => ({stdout, stderr: '', code: 0, ...(effects ? {effects} : {})});
  const fail = (stderr, code = 1) => ({stdout: '', stderr, code});
  const unsupported = (syntax) => ({...fail('Simulator: unsupported command or option. Supported: ' + syntax), unsupported: true});
  const lines = (items) => items.join('\n');

  function seed(scenario) {
    const s = SCENARIOS.includes(scenario) ? scenario : 'base';
    return {
      version: 1,
      scenario: s,
      adapter: {
        name: 'Wi-Fi', connected: s !== 'wifi-off', ssid: s === 'vpn-route' ? 'Home-Wi-Fi' : 'CORP-Staff',
        mac: '02-20-00-00-00-14', ip: s === 'vpn-route' ? '192.168.50.14' : '10.20.0.14',
        mask: '255.255.255.0', gateway: s === 'vpn-route' ? '192.168.50.1' : '10.20.0.1',
        dhcp: true, dns: s === 'dns-wrong' ? '192.0.2.53' : s === 'vpn-route' ? '192.168.50.1' : '10.20.0.10',
        dnsAutomatic: s !== 'dns-wrong', leaseRenewals: 0
      },
      vpn: {connected: s === 'vpn-route', ip: '10.99.0.14', corporateRoute: s !== 'vpn-route', dns: '10.20.0.10'},
      cache: s === 'dns-cache' ? [{name: 'intranet.corp.example', address: '10.20.0.99', ttl: 300}] : [],
      winhttp: {proxy: s === 'proxy-mismatch' ? 'proxy-old.corp.example:8080' : '', bypass: s === 'proxy-mismatch' ? '<local>' : ''},
      domain: {name: 'corp.example', controller: 'dc01.corp.example', policyCurrent: s !== 'ad-policy', refreshes: 0, timeSource: 'dc01.corp.example'},
      http: {intranetStatus: s === 'web-503' ? 503 : 200},
      firewall: {domain: 'ON', private: 'ON', public: 'ON', current: s === 'wifi-off' || s === 'vpn-route' ? 'Public' : 'Domain'}
    };
  }

  function restore(raw, scenario) {
    const restored = seed(scenario);
    const invalid = () => { throw new Error('Invalid saved network state.'); };
    if (!raw || typeof raw !== 'object' || !raw.adapter || !raw.domain || !Array.isArray(raw.cache) || raw.cache.length > Object.keys(RECORDS).length) invalid();
    const counter = value => Number.isSafeInteger(value) && value >= 0 && value <= 1000000;
    if (!counter(raw.adapter.leaseRenewals) || !counter(raw.domain.refreshes) || typeof raw.domain.policyCurrent !== 'boolean') invalid();
    if (!raw.domain.policyCurrent && (restored.scenario !== 'ad-policy' || raw.domain.refreshes > 0)) invalid();
    if (restored.scenario === 'ad-policy' && raw.domain.policyCurrent && raw.domain.refreshes === 0) invalid();
    const seen = new Set();
    const cache = [];
    for (const entry of raw.cache) {
      if (!entry || typeof entry !== 'object' || !Object.prototype.hasOwnProperty.call(RECORDS, entry.name) || seen.has(entry.name)) invalid();
      if (entry.address !== RECORDS[entry.name] && !(restored.scenario === 'dns-cache' && entry.name === 'intranet.corp.example' && entry.address === '10.20.0.99')) invalid();
      if (entry.ttl !== 300) invalid();
      seen.add(entry.name);
      cache.push({name: entry.name, address: entry.address, ttl: 300});
    }
    restored.cache = cache;
    restored.adapter.leaseRenewals = raw.adapter.leaseRenewals;
    restored.domain.refreshes = raw.domain.refreshes;
    restored.domain.policyCurrent = raw.domain.policyCurrent;
    // Compare the complete fixed shape, rejecting injected keys and altered lab data.
    const sameShape = (value, expected) => {
      if (expected === null || typeof expected !== 'object') return value === expected;
      if (!value || typeof value !== 'object' || Array.isArray(value) !== Array.isArray(expected)) return false;
      const prototype = Object.getPrototypeOf(value);
      if (Array.isArray(value) ? prototype !== Array.prototype : prototype !== Object.prototype && prototype !== null) return false;
      const actualKeys = Object.keys(value).sort(), expectedKeys = Object.keys(expected).sort();
      return actualKeys.length === expectedKeys.length && expectedKeys.every((key, i) => key === actualKeys[i] && sameShape(value[key], expected[key]));
    };
    if (!sameShape(raw, restored)) {
      // v0.1 exports used one DNS field for both adapters. Accept only that exact
      // earlier model, then upgrade it; never copy arbitrary network settings.
      const legacy = JSON.parse(JSON.stringify(restored));
      delete legacy.vpn.dns;
      if (restored.scenario === 'vpn-route') {
        legacy.adapter.dns = '10.20.0.10';
        legacy.adapter.ssid = 'CORP-Staff';
      }
      if (!sameShape(raw, legacy)) invalid();
    }
    return restored;
  }

  function knownTarget(net, raw) {
    const host = String(raw).toLowerCase().replace(/\.$/, '');
    if (host === 'localhost' || host === '127.0.0.1') return {host, ip: '127.0.0.1', literal: true};
    if (host === 'pc-014' || host === 'pc-014.corp.example') return {host, ip: net.adapter.ip, literal: true};
    if (Object.prototype.hasOwnProperty.call(RECORDS, host)) return {host, ip: RECORDS[host], literal: false};
    if (['10.20.0.1', '10.20.0.10', '10.20.0.14', '10.20.0.20', '10.20.0.30', '10.20.0.99', '192.0.2.80', net.adapter.ip, net.adapter.gateway, net.vpn.ip].includes(host)) {
      return {host, ip: host, literal: true};
    }
    return null;
  }

  function reachable(net, ip) {
    if (ip === '127.0.0.1' || ip === net.adapter.ip) return true;
    if (!net.adapter.connected) return false;
    if (ip === '10.20.0.99') return false;
    if (net.vpn.connected && !net.vpn.corporateRoute && /^10\.20\.0\./.test(ip) && ip !== '10.20.0.10') return false;
    return true;
  }

  function resolverDns(net) { return net.vpn.connected ? net.vpn.dns : net.adapter.dns; }

  function resolve(net, raw, useCache = true, server) {
    const target = knownTarget(net, raw);
    if (!target) return {error: 'unsupported', host: raw};
    if (target.literal) return target;
    if (useCache) {
      const cached = net.cache.find(entry => entry.name === target.host);
      if (cached) return {...target, ip: cached.address};
    }
    const dns = server || resolverDns(net);
    if (!net.adapter.connected || !reachable(net, dns)) return {error: 'dns', host: raw};
    if (dns === '192.168.50.1' && net.scenario === 'vpn-route') {
      if (target.host !== 'example.com') return {error: 'nxdomain', host: raw};
    } else if (dns !== '10.20.0.10') return {error: 'dns', host: raw};
    if (useCache) net.cache.push({name: target.host, address: target.ip, ttl: 300});
    return target;
  }

  function targetError(target, name) {
    if (target.error === 'unsupported') return unsupported(name + ' <known lab host or address>; this host is not modeled: ' + target.host);
    if (target.error === 'dns' || target.error === 'nxdomain') return fail(name + ': could not resolve host ' + target.host + '.');
    return null;
  }

  function adapterText(net, all) {
    const a = net.adapter;
    const out = ['Windows IP Configuration'];
    if (all) out.push('', '   Host Name . . . . . . . . . . . . : PC-014', '   Primary Dns Suffix  . . . . . . . : corp.example', '   Node Type . . . . . . . . . . . . : Hybrid');
    out.push('', 'Wireless LAN adapter Wi-Fi:', '', '   Connection-specific DNS Suffix  . : ' + (net.vpn.connected ? '' : 'corp.example'));
    if (all) out.push('   Description . . . . . . . . . . . : Virtual Wi-Fi Adapter', '   Physical Address. . . . . . . . . : ' + a.mac, '   DHCP Enabled. . . . . . . . . . . : Yes');
    if (!a.connected) out.push('   Media State . . . . . . . . . . . : Media disconnected');
    else {
      out.push('   IPv4 Address. . . . . . . . . . . : ' + a.ip, '   Subnet Mask . . . . . . . . . . . : ' + a.mask, '   Default Gateway . . . . . . . . . : ' + a.gateway);
      if (all) out.push('   DHCP Server . . . . . . . . . . . : ' + a.gateway, '   DNS Servers . . . . . . . . . . . : ' + a.dns, '   NetBIOS over Tcpip. . . . . . . . : Enabled');
    }
    if (net.vpn.connected) {
      out.push('', 'PPP adapter CORP-VPN:', '', '   Connection-specific DNS Suffix  . : corp.example');
      if (all) out.push('   Description . . . . . . . . . . . : CORP-VPN', '   DHCP Enabled. . . . . . . . . . . : No');
      out.push('   IPv4 Address. . . . . . . . . . . : ' + net.vpn.ip, '   Subnet Mask . . . . . . . . . . . : 255.255.255.255', '   Default Gateway . . . . . . . . . :');
      if (all) out.push('   DNS Servers . . . . . . . . . . . : ' + net.vpn.dns);
    }
    return lines(out);
  }

  function ipconfig(net, args) {
    const usage = 'ipconfig [/all | /displaydns | /flushdns | /renew]';
    if (args.length > 1) return unsupported(usage);
    const mode = (args[0] || '').toLowerCase();
    if (!mode || mode === '/all') return ok(adapterText(net, mode === '/all'));
    if (mode === '/displaydns') {
      const out = ['Windows IP Configuration'];
      if (!net.cache.length) out.push('', 'The DNS Resolver Cache is empty.');
      for (const entry of net.cache) out.push('', '    ' + entry.name, '    ----------------------------------------', '    Record Name . . . . . : ' + entry.name, '    Record Type . . . . . : 1', '    Time To Live  . . . . : ' + entry.ttl, '    Data Length . . . . . : 4', '    Section . . . . . . . : Answer', '    A (Host) Record . . . : ' + entry.address);
      return ok(lines(out));
    }
    if (mode === '/flushdns') {
      net.cache = [];
      return ok('Windows IP Configuration\n\nSuccessfully flushed the DNS Resolver Cache.', ['DNS resolver cache cleared']);
    }
    if (mode === '/renew') {
      if (!net.adapter.connected) return fail('No operation can be performed on Wi-Fi while it has its media disconnected.');
      net.adapter.leaseRenewals += 1;
      return ok(adapterText(net, false), ['DHCP lease renewed; manually configured DNS is unchanged']);
    }
    return unsupported(usage);
  }

  function hostArgs(args, command) {
    let host = null, count = 4, numeric = false;
    for (let i = 0; i < args.length; i++) {
      const arg = args[i].toLowerCase();
      if (command === 'ping' && arg === '-n') {
        if (!/^\d+$/.test(args[i + 1] || '') || +args[i + 1] < 1 || +args[i + 1] > 10) return null;
        count = +args[++i];
      } else if (['tracert', 'pathping'].includes(command) && arg === '-d') numeric = true;
      else if (arg === '-4') { /* Only IPv4 is modeled. */ }
      else if (/^[-/]/.test(arg) || host !== null) return null;
      else host = args[i];
    }
    return host === null ? null : {host, count, numeric};
  }

  function ping(net, args) {
    const parsed = hostArgs(args, 'ping');
    if (!parsed) return unsupported('ping [-4] [-n 1..10] <host>');
    const target = resolve(net, parsed.host);
    const error = targetError(target, 'ping');
    if (error) return error;
    const connected = reachable(net, target.ip);
    const out = ['', 'Pinging ' + (target.literal ? target.ip : target.host + ' [' + target.ip + ']') + ' with 32 bytes of data:'];
    for (let i = 0; i < parsed.count; i++) out.push(connected ? 'Reply from ' + target.ip + ': bytes=32 time<1ms TTL=128' : 'Request timed out.');
    out.push('', 'Ping statistics for ' + target.ip + ':', '    Packets: Sent = ' + parsed.count + ', Received = ' + (connected ? parsed.count : 0) + ', Lost = ' + (connected ? 0 : parsed.count) + ' (' + (connected ? '0' : '100') + '% loss),');
    if (connected) out.push('Approximate round trip times in milli-seconds:', '    Minimum = 0ms, Maximum = 0ms, Average = 0ms');
    return {stdout: lines(out), stderr: '', code: connected ? 0 : 1};
  }

  function nslookup(net, args) {
    const usage = 'nslookup <lab host> [lab DNS address] | nslookup -type=SRV _ldap._tcp.dc._msdcs.corp.example';
    const items = args.slice();
    let srv = false;
    if ((items[0] || '').toLowerCase() === '-type=srv') { srv = true; items.shift(); }
    if (items.length < 1 || items.length > 2 || items.some(item => /^[-/]/.test(item))) return unsupported(usage);
    const host = items[0].toLowerCase().replace(/\.$/, '');
    const server = items[1] || resolverDns(net);
    const servers = ['10.20.0.10', '192.0.2.53', 'dc01.corp.example', ...(net.scenario === 'vpn-route' ? ['192.168.50.1'] : [])];
    if (!servers.includes(server.toLowerCase())) return unsupported(usage + '; DNS server not modeled: ' + server);
    const dns = server.toLowerCase() === 'dc01.corp.example' ? '10.20.0.10' : server;
    if (srv && host !== '_ldap._tcp.dc._msdcs.corp.example') return unsupported(usage);
    const target = srv ? resolve(net, 'dc01.corp.example', false, dns) : resolve(net, host, false, dns);
    if (target.error === 'unsupported') return targetError(target, 'nslookup');
    const heading = 'Server:  ' + (dns === '10.20.0.10' ? 'dc01.corp.example' : 'UnKnown') + '\nAddress:  ' + dns;
    if (target.error === 'nxdomain') return {stdout: heading, stderr: '*** UnKnown can\'t find ' + host + ': Non-existent domain', code: 1};
    if (target.error || !net.adapter.connected || !reachable(net, dns) || !['10.20.0.10', '192.168.50.1'].includes(dns)) return {stdout: heading + '\n\nDNS request timed out.\n    timeout was 2 seconds.', stderr: '*** Request to ' + (dns === '10.20.0.10' ? 'dc01.corp.example' : 'UnKnown') + ' timed-out', code: 1};
    if (srv) return ok(heading + '\n\n' + host + ' SRV service location:\n          priority = 0\n          weight = 100\n          port = 389\n          svr hostname = dc01.corp.example\ndc01.corp.example internet address = 10.20.0.10');
    return ok(heading + '\n\nName:    ' + target.host + '\nAddress:  ' + target.ip);
  }

  function traceRoute(net, args, pathpingMode) {
    const command = pathpingMode ? 'pathping' : 'tracert';
    const parsed = hostArgs(args, command);
    if (!parsed) return unsupported(command + ' [-d] [-4] <host>');
    const target = resolve(net, parsed.host);
    const error = targetError(target, command);
    if (error) return error;
    const out = ['', 'Tracing route to ' + target.host + ' [' + target.ip + ']', 'over a maximum of 30 hops:', ''];
    const up = reachable(net, target.ip);
    const local = target.ip === '127.0.0.1' || target.ip === net.adapter.ip;
    const localSubnet = target.ip.startsWith(net.adapter.ip.split('.').slice(0, 3).join('.') + '.');
    let hops = [];
    if (local || localSubnet && up) hops = [target.ip];
    else if (up) hops = [net.adapter.gateway, target.ip];
    else if (net.adapter.connected && !localSubnet) hops = [net.adapter.gateway, '*'];
    else hops = ['*'];
    if (pathpingMode) out.push('  0  PC-014 [' + net.adapter.ip + ']');
    hops.forEach((ip, i) => out.push(ip === '*' ? '  ' + (i + 1) + '     *        *        *     Request timed out.' : '  ' + (i + 1) + '    <1 ms    <1 ms    <1 ms  ' + ip));
    if (up) out.push('', 'Trace complete.');
    else out.push('', 'Simulator: remaining unresponsive hops omitted. A non-response alone does not identify the cause.');
    if (pathpingMode) {
      out.push('', 'Computing statistics for 50 seconds... (simulated; no real waiting)', '            Source to Here   This Node/Link', 'Hop  RTT    Lost/Sent = Pct  Lost/Sent = Pct  Address');
      hops.forEach((ip, i) => out.push(ip === '*' ? ' ' + (i + 1) + '  ---     100/100 =100%   100/100 =100%    *' : ' ' + (i + 1) + '  0ms       0/100 =  0%     0/100 =  0%    ' + ip));
      out.push('', 'Statistics are fictional. ICMP filtering can affect these results.');
    }
    return ok(lines(out));
  }

  function route(net, args) {
    if (args.length !== 1 || args[0].toLowerCase() !== 'print') return unsupported('route print');
    const a = net.adapter;
    const out = ['Interface List', ' 12...02 20 00 00 00 14 ......Virtual Wi-Fi Adapter'];
    if (net.vpn.connected) out.push(' 24...........................CORP-VPN');
    out.push('  1...........................Software Loopback Interface 1', '', 'IPv4 Route Table', 'Active Routes:', 'Network Destination        Netmask          Gateway       Interface  Metric');
    if (a.connected) {

      const subnet = a.ip.split('.').slice(0, 3).join('.') + '.0';
      out.push(subnet.padStart(17) + '    255.255.255.0         On-link    ' + a.ip.padStart(12) + '    281');
      if (net.vpn.connected) out.push('       10.20.0.10  255.255.255.255         On-link     10.99.0.14      5', '       10.99.0.14  255.255.255.255         On-link     10.99.0.14    261');
    }
    out.push('        127.0.0.0        255.0.0.0         On-link       127.0.0.1    331', '', 'Persistent Routes:', '  None');
    return ok(lines(out));
  }

  function arp(net, args) {
    if (args.length !== 1 || args[0].toLowerCase() !== '-a') return unsupported('arp -a');

    return ok(lines(out));
  }

  function netstat(net, args) {
    let all = false, pid = false, numeric = false;
    for (const arg of args) {
      if (!/^-[ano]+$/i.test(arg)) return unsupported('netstat [-a] [-n] [-o] (combined flags supported)');
      all = all || /a/i.test(arg); pid = pid || /o/i.test(arg); numeric = numeric || /n/i.test(arg);
    }
    const out = ['', 'Active Connections', '', '  Proto  Local Address          Foreign Address        State' + (pid ? '           PID' : '')];
    if (all) {
      out.push('  TCP    0.0.0.0:135            0.0.0.0:0              LISTENING' + (pid ? '       1080' : ''), '  TCP    0.0.0.0:445            0.0.0.0:0              LISTENING' + (pid ? '       4' : ''));
    }
    if (reachable(net, '10.20.0.20')) out.push('  TCP    ' + (net.adapter.ip + ':49712').padEnd(23) + (numeric ? '10.20.0.20:443' : 'intranet.corp.example:https').padEnd(23) + 'ESTABLISHED' + (pid ? '     4240' : ''));
    if (all) out.push('  UDP    0.0.0.0:5353           *:*' + (pid ? '                                    4240' : ''));
    return ok(lines(out));
  }

  function netsh(net, args) {
    const key = args.map(arg => arg.toLowerCase()).join(' ');
    const a = net.adapter;
    if (key === 'wlan show interfaces') return ok(lines(['There is 1 interface on the system:', '', '    Name                   : Wi-Fi', '    Description            : Virtual Wi-Fi Adapter', '    Physical address       : ' + a.mac.toLowerCase().replace(/-/g, ':'), '    State                  : ' + (a.connected ? 'connected' : 'disconnected'), ...(a.connected ? ['    SSID                   : ' + a.ssid, '    Network type           : Infrastructure', '    Radio type             : 802.11ac', '    Authentication         : ' + (net.vpn.connected ? 'WPA2-Personal' : 'WPA2-Enterprise'), '    Channel                : 36', '    Receive rate (Mbps)    : 866.7', '    Transmit rate (Mbps)   : 866.7', '    Signal                 : 92%', '    Profile                : ' + a.ssid] : [])]));
    if (key === 'wlan show profiles') return ok('Profiles on interface Wi-Fi:\n\nGroup policy profiles (read only)\n---------------------------------\n    CORP-Staff\n\nUser profiles\n-------------\n    ' + (net.vpn.connected ? 'All User Profile     : Home-Wi-Fi' : '<None>'));
    if (key === 'interface ipv4 show config') {
      const out = ['Configuration for interface "Wi-Fi"', '    DHCP enabled:                         Yes', ...(a.connected ? ['    IP Address:                           ' + a.ip, '    Subnet Prefix:                        ' + a.ip.split('.').slice(0, 3).join('.') + '.0/24 (mask 255.255.255.0)', '    Default Gateway:                      ' + a.gateway] : ['    Interface state:                      disconnected']), '    ' + (a.dnsAutomatic ? 'DNS servers configured through DHCP:  ' : 'Statically Configured DNS Servers:     ') + a.dns];
      if (net.vpn.connected) out.push('', 'Configuration for interface "CORP-VPN"', '    DHCP enabled:                         No', '    IP Address:                           ' + net.vpn.ip, '    Subnet Prefix:                        ' + net.vpn.ip + '/32 (mask 255.255.255.255)', '    Statically Configured DNS Servers:     ' + net.vpn.dns);

    }

    if (key === 'winhttp show advproxy') return ok('Current WinHTTP advanced proxy settings (simulated):\n\n' + JSON.stringify({Proxy: net.winhttp.proxy, ProxyBypass: net.winhttp.bypass, AutoconfigUrl: '', AutoDetect: false}, null, 2));
    if (key === 'advfirewall show allprofiles' || key === 'advfirewall show currentprofile') {

      return ok(profiles.map(profile => profile + ' Profile Settings:\n----------------------------------------------------------------------\nState                                 ' + net.firewall[profile.toLowerCase()] + '\nFirewall Policy                       BlockInbound,AllowOutbound\nLocalFirewallRules                    N/A (GPO-store only)').join('\n\n') + '\n\nOk.');

  }

  function netUse(net, args) {
    if ((args[0] || '').toLowerCase() !== 'use') return null;
    if (args.length !== 1) return unsupported('net use (list existing mappings only)');
    if (!net.domain.policyCurrent) return ok('New connections will be remembered.\n\nThere are no entries in the list.');
    return ok('New connections will be remembered.\n\nStatus       Local     Remote                    Network\n-------------------------------------------------------------------------------\n' + (reachable(net, '10.20.0.30') ? 'OK' : 'Unavailable').padEnd(13) + 'Z:        \\\\files.corp.example\\Team Microsoft Windows Network\nThe command completed successfully.');
  }

  function gpresult(net, args) {
    let report = false, scope = 'both';
    for (let i = 0; i < args.length; i++) {
      const arg = args[i].toLowerCase();
      if (arg === '/r' && !report) report = true;
      else if (arg === '/scope' && scope === 'both' && ['user', 'computer'].includes((args[i + 1] || '').toLowerCase())) scope = args[++i].toLowerCase();
      else return unsupported('gpresult /r [/scope user|computer]');
    }
    if (!report) return unsupported('gpresult /r [/scope user|computer]');
    const out = ['Microsoft (R) Windows (R) Operating System Group Policy Result tool', '', 'RSOP data for CORP\\student on PC-014 : Logging Mode', '', 'OS Configuration:            Member Workstation', 'Domain Name:                 CORP', 'Domain Type:                 Windows 2008 or later'];

  const lesson = (spec) => {
    // Rotate answer positions deterministically so a correct option is not always in one place.
    let question = spec.question;
    if (question) {
      const options = interpretationChoices[spec.id];
      if (!options || options.length !== 3) throw new Error('Missing interpretation choices: ' + spec.id);
      question = { ...question, choices: options.map((choice, index) => ({ id: 'abc'[index], ...choice })), answer: 'b' };
      const shift = Array.from(spec.id).reduce((sum, char) => sum + char.charCodeAt(0), 0) % question.choices.length;
      const ordered = question.choices.slice(shift).concat(question.choices.slice(0, shift));
      const answerIndex = ordered.findIndex(choice => choice.id === question.answer);
      question = { ...question, choices: ordered.map((choice, index) => ({ ...choice, id: 'abc'[index] })), answer: 'abc'[answerIndex] };
    }
    return { ...spec, ...(question ? { question } : {}), session: { scenario: 'base', ...(spec.session || {}) } };
  };

      $('lesson-search').addEventListener('input', e => { courseSearch = e.target.value; $('lesson-groups').innerHTML = navGroups(courseSearch.toLowerCase()); });
      $('scenario-select')?.addEventListener('change', e => { state.checkpoints.sandbox = Engine.fresh({ session: { scenario: e.target.value } }); visibleFrom.sandbox = 0; render(); save(); });
    }
  }
  function renderHints() {
    if (!lesson() || !$('hints')) return;
    const l = lesson(), current = cp();
    $('hints').innerHTML = `<div class="hint-actions"><button class="small" data-action="hint" ${current.hintLevel >= l.hints.length ? 'disabled' : ''}>${current.hintLevel >= l.hints.length ? t('hintsDone') : `${t('hint')} ${current.hintLevel + 1} / ${l.hints.length}`}</button><button class="small" data-action="solution" ${current.solutionShown ? 'disabled' : ''}>${t('solution')}</button></div>${l.hints.slice(0, current.hintLevel).map((h, i) => `<div class="hint"><strong>${t('hint')} ${i + 1}</strong><br>${escape(loc(h))}</div>`).join('')}${current.solutionShown ? `<div class="solution"><p class="label">${t('solutionLabel')}</p><pre>${escape(l.solution.join('\n'))}</pre></div>` : ''}`;
  }
  function renderConsole() {
    const box = $('console-output'); if (!box) return;
    const history = cp().session.history || [], start = Math.max(visibleFrom[currentId] || 0, history.length - 30);
    box.innerHTML = `<div class="terminal-welcome">${escape(t('welcome')).replace(/\n/g, '<br>')}</div>` + history.slice(start).map((h, i) => `<div class="history-entry"><div class="history-command"><span class="prompt-prefix">&gt;</span> ${escape(h.line)}</div>${h.stdout ? `<pre>${escape(h.stdout)}</pre>` : ''}${h.stderr ? `<pre class="history-error">${escape(h.stderr)}</pre>` : ''}${h.trace?.length ? `<button class="trace-open" data-trace="${start + i}">${t('trace')} · ${h.trace.length}</button>` : ''}</div>`).join('');
    $('prompt-path').textContent = cp().session.cwd; box.scrollTop = box.scrollHeight;
  }
  function renderFiles() {
    if (!$('file-list')) return;
    $('file-list').innerHTML = Shell.listFiles(cp().session).filter(f => !f.dir).sort((a, b) => a.path.localeCompare(b.path)).map(f => `<div class="file-row"><span class="file-name">${escape(f.path)}</span><button data-read="${escape(f.path)}">${t('read')}</button><button data-path="${escape(f.path)}">${t('insert')}</button></div>`).join('');
  }
  function renderStatus() {
    if (!$('evidence')) return;
    const l = lesson(), result = l ? Engine.grade(l, cp().session, cp().answer, cp().evidence) : null;
    const done = l && !!state.completed[l.id];
    $('evidence').innerHTML = `<div><strong class="${result?.commandOk || done ? 'ready' : ''}">${!l ? t('ready') : done ? `✓ ${t('completedTitle')}` : result.commandOk ? `✓ ${t('evidenceReady')}` : t('evidencePending')}</strong><span class="subtle">${!l ? t('saved') : done ? t('completedText') : result.commandOk && l.question ? t('evidenceQuestion') : t('evidenceHint')}</span></div>`;
    if (!l) return;
    const f = $('feedback');
    if (done && result.ok) f.innerHTML = `<div class="feedback success"><strong>✓ ${t('completedTitle')}</strong><p>${escape(loc(l.success))}</p>${l.question ? `<p style="margin-top:8px">${escape(loc(l.question.explanation))}</p>` : ''}</div>`;
    else if (done && !feedback) f.innerHTML = `<div class="feedback record"><strong>✓ ${t('recordTitle')}</strong><p>${t('recordText')}</p></div>`;
    else if (feedback) {
      const choice = feedback.commandOk && l.question?.choices.find(ch=>ch.id===cp().answer);
      f.innerHTML = `<div class="feedback"><strong>${t('notYet')}</strong>${choice?.feedback ? `<p class="label">${t('choiceFeedback')}</p><p class="choice-feedback">${escape(loc(choice.feedback))}</p>` : `<p>${feedback.commandOk ? t('needAnswer') : t('needCommands')}</p>`}</div>`;
    }
    else f.innerHTML = '';
    if (l.question && cp().attempts.incorrect) f.insertAdjacentHTML('beforeend',`<p class="micro answer-attempts">${t('wrongAttempts')}: ${cp().attempts.incorrect}</p>`);
    const item = document.querySelector(`.lesson-item[data-open="${CSS.escape(l.id)}"]`);
    if (item && done) { item.classList.add('done'); item.querySelector('.status').textContent = '✓'; }
  }
  function check(automatic = false) {
    const l = lesson(); if (!l) return;
    const result = Engine.grade(l, cp().session, cp().answer, cp().evidence);
    if (!automatic && result.commandOk && !result.answerOk && l.question?.choices.some(ch=>ch.id===cp().answer)) {
      cp().attempts.incorrect = Math.min(1000000,cp().attempts.incorrect+1);
      cp().attempts.byChoice[cp().answer] = Math.min(1000000,(cp().attempts.byChoice[cp().answer] || 0)+1);
      save();
    }
    if (result.ok && !state.completed[l.id]) {
      state.completed[l.id] = { at: new Date().toISOString(), hints: cp().hintLevel, solutionUsed: cp().solutionShown };
      feedback = null; save();
      $('lesson-groups').innerHTML = navGroups(courseSearch.toLowerCase());
      const top = document.querySelector('.nav-top');
      if (top) { top.querySelector('h2 .subtle').textContent = `${progressCount()}/${Data.lessons.length}`; const bar = top.querySelector('[role="progressbar"]'); bar.setAttribute('aria-valuenow', progressCount()); bar.firstElementChild.style.width = `${100 * progressCount() / Data.lessons.length}%`; }
    } else if (!automatic) feedback = result;
    renderStatus();
  }
  function runCommand() {
    if (composing) return;
    const input = $('command-input'), line = input.value.trim();
    if (!line) return;
    const historyLength = cp().session.history.length;
    try { const result = Shell.run(cp().session, line, {language:state.language}); if (lesson()) cp().evidence = Engine.observe(lesson(),result,cp().evidence); }
    catch (error) { toast(state.language === 'ja' ? 'この入力は処理できませんでした。入力を確認してください。' : 'Could not process this input. Please check the command.'); console.error(error); return; }
    const dropped = Math.max(0, historyLength + 1 - cp().session.history.length);
    visibleFrom[currentId] = Math.max(0, (visibleFrom[currentId] || 0) - dropped);
    if (/^cls\s*$/i.test(line)) visibleFrom[currentId] = cp().session.history.length;
    input.value = ''; cp().input = ''; historyCursor = -1; historyDraft = ''; feedback = null;
    renderConsole(); renderFiles(); check(true); renderStatus(); save(); input.focus({ preventScroll: true });
  }
  function bindInput() {
    const input = $('command-input');
    $('command-form').addEventListener('submit', e => { e.preventDefault(); if (!composing) runCommand(); });
    input.addEventListener('input', () => { cp().input = input.value; historyCursor = -1; deferSave(); });
    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => { composing = false; });
    input.addEventListener('keydown', e => {
      if (e.isComposing || composing || e.keyCode === 229) return;
      if (e.key === 'Enter') { e.preventDefault(); runCommand(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') { e.preventDefault(); visibleFrom[currentId] = cp().session.history.length; renderConsole(); return; }
      if (e.ctrlKey && e.key.toLowerCase() === 'c' && input.selectionStart === input.selectionEnd) { e.preventDefault(); input.value = ''; cp().input = ''; save(); return; }
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault(); const commands = cp().session.history.map(h => h.line);
        if (!commands.length) return;
        if (historyCursor < 0) { historyCursor = commands.length; historyDraft = input.value; }
        historyCursor = Math.max(0, Math.min(commands.length, historyCursor + (e.key === 'ArrowUp' ? -1 : 1)));
        input.value = historyCursor === commands.length ? historyDraft : commands[historyCursor];
        input.setSelectionRange(input.value.length, input.value.length); cp().input = input.value; deferSave();
      } else if (e.key === 'Tab' && !e.shiftKey && input.value) {
        const candidates = Shell.complete ? Shell.complete(cp().session, input.value) : [];
        if (candidates.length) { e.preventDefault(); input.value = candidates[0]; cp().input = input.value; deferSave(); if (candidates.length > 1) toast(candidates.slice(0, 4).join(' · ')); }
      } else if (e.key === 'ArrowRight' && !e.repeat && !e.shiftKey && !input.value && lesson() && state.completed[currentId] && !window.getSelection()?.toString()) { e.preventDefault(); nextLesson(); }
    });
  }
  function nextLesson() { const i = Data.lessons.indexOf(lesson()); if (i < Data.lessons.length - 1 && i >= 0) openLesson(Data.lessons[i + 1].id, true); else showHome(); }
  function insert(text, append = false) { const input = $('command-input'); input.value = append ? `${input.value}${input.value && !input.value.endsWith(' ') ? ' ' : ''}${text}` : text; cp().input = input.value; input.focus(); input.setSelectionRange(input.value.length, input.value.length); save(); }
  function openDialog(title, html) { $('dialog-title').textContent = title; $('dialog-body').innerHTML = html; if (!$('dialog').open) $('dialog').showModal(); }
  function showSettings() {
    openDialog(t('settings'), `<section class="settings-section"><h3>${t('progress')}</h3><p>${t('dataInfo')}</p><div class="settings-actions"><button data-action="export">${t('export')}</button><button data-action="import">${t('import')}</button>${unreadableProgress !== null ? `<button data-action="rescue">${t('rescueProgress')}</button>` : ''}</div><p>${t('savedDetail')}</p></section><section class="settings-section"><h3>${t('about')}</h3><p>${escape(t('aboutText')).replace(/\n/g, '<br>')}</p><p>${t('simNote')}</p></section><button class="small danger" data-action="erase">${t('erase')}</button>`);
  }
  function showMap() {
    openDialog(t('home'), `<p class="subtle">${t('courseSub')}</p>${Data.tracks.map((tr,i)=>`<section class="map-group"><h3>0${i+1} · ${escape(loc(tr.title))}</h3>${Data.lessons.filter(l=>l.track===tr.id).map(l=>`<button class="map-lesson ${state.completed[l.id]?'done':''}" data-open="${escape(l.id)}"><span>${state.completed[l.id]?'✓':String(Data.lessons.indexOf(l)+1).padStart(2,'0')}</span>${escape(shortTitle(l.title))}</button>`).join('')}</section>`).join('')}`);
  }
  function showReference() {
    const all = new Map();
    for (const ref of [...(Shell.reference || []), ...(globalThis.WCRNetwork.reference || [])]) if (!all.has(ref.name)) all.set(ref.name, ref);
    const refs = [...all.values()].sort((a, b) => a.name.localeCompare(b.name));
    openDialog(t('reference'), `<p class="subtle">${t('refScope')}</p><input class="reference-search" id="reference-search" type="search" placeholder="${t('refSearch')}" aria-label="${t('refSearch')}"><div id="reference-results"></div>`);
    const draw = q => { $('reference-results').innerHTML = refs.filter(r => `${r.name} ${r.summaryJa} ${r.summaryEn} ${r.syntax}`.toLowerCase().includes(q.toLowerCase())).map(r => `<article class="reference-item"><h3>${escape(r.name)}</h3><p>${escape(state.language === 'en' ? r.summaryEn : r.summaryJa)}</p><pre>${escape(r.syntax)}</pre></article>`).join('') || `<p>${t('noResults')}</p>`; };
    draw(''); $('reference-search').addEventListener('input', e => draw(e.target.value));
  }
  function showTrace(index) {
    const entry = cp().session.history[index]; if (!entry) return;
    openDialog(t('trace'), `<pre>${escape(entry.line)}</pre>${entry.trace.map((tr, i) => `<section class="trace-stage"><h3>${i + 1}. ${escape(tr.command || tr.name)} · exit ${tr.code}</h3><p class="label">${t('traceInput')}</p><pre>${escape(tr.input || t('noInput'))}</pre><p class="label">${t('traceOutput')}</p><pre>${escape(tr.output || '—')}</pre>${tr.error ? `<p class="label">${t('traceError')}</p><pre>${escape(tr.error)}</pre>` : ''}</section>`).join('')}`);
  }
  function exportData(rescue = false) {
    save(); const blob = new Blob([rescue ? unreadableProgress : JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = `windowsCLIroom-${rescue ? 'unreadable-original' : 'progress'}-${new Date().toISOString().slice(0, 10)}.json`; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000); toast(t('exported'));
  }
  async function importData(file) {
    if (!file) return;
    try {
      if (file.size > Engine.MAX_IMPORT) throw new Error('Too large');
      const candidate = Engine.parse(await file.text());
      if (!confirm(t('importConfirm'))) return;
      clearTimeout(saveTimer); state = candidate; unreadableProgress = null; currentId = ''; view = 'home'; feedback = null;
      for (const key of Object.keys(visibleFrom)) delete visibleFrom[key];
      $('dialog').close(); save(); render(); toast(t('imported'));
    } catch { toast(t('importFail')); }
    finally { $('import-file').value = ''; }
  }
  function action(name) {
    if (name === 'sandbox') openLesson('sandbox');
    else if (name === 'courses') { courseOpen = !courseOpen; document.querySelector('.workspace').classList.toggle('course-open', courseOpen); }
    else if (name === 'hint') { cp().hintLevel = Math.min(lesson().hints.length, cp().hintLevel + 1); renderHints(); save(); }
    else if (name === 'solution') { cp().solutionShown = true; renderHints(); save(); }
    else if (name === 'check') check();
    else if (name === 'previous') { const i = Data.lessons.indexOf(lesson()); if (i > 0) openLesson(Data.lessons[i - 1].id); }
    else if (name === 'next') nextLesson();
    else if (name === 'clear') { visibleFrom[currentId] = cp().session.history.length; renderConsole(); }
    else if (name === 'reset' && confirm(t('resetConfirm'))) { state.checkpoints[currentId] = Engine.fresh(lesson() || { session: { scenario: cp().session.scenario } }); visibleFrom[currentId] = 0; feedback = null; render(); save(); }
    else if (name === 'export') exportData();
    else if (name === 'rescue' && unreadableProgress !== null) exportData(true);
    else if (name === 'import') $('import-file').click();
    else if (name === 'erase' && confirm(t('eraseConfirm'))) { clearTimeout(saveTimer); unreadableProgress = null; const language = state.language; state = Engine.empty(); state.language = language; currentId = ''; view = 'home'; feedback = null; for (const key of Object.keys(visibleFrom)) delete visibleFrom[key]; $('dialog').close(); save(); render(); toast(t('erased')); }
  }
  document.addEventListener('click', e => {
    const button = e.target.closest('button'); if (!button || button.disabled) return;
    if (button.dataset.open) { if ($('dialog').open) $('dialog').close(); openLesson(button.dataset.open); }
    else if (button.dataset.action) action(button.dataset.action);
    else if (button.dataset.insert !== undefined) insert(button.dataset.insert);
    else if (button.dataset.path) insert(`"${button.dataset.path}"`, true);
    else if (button.dataset.read) { const f = Shell.listFiles(cp().session).find(f => f.path === button.dataset.read); if (f) openDialog(f.path, `<pre>${escape(f.content)}</pre>`); }
    else if (button.dataset.trace !== undefined) showTrace(Number(button.dataset.trace));
  });
  document.addEventListener('change', e => { if (e.target.matches('input[name="answer"]')) { cp().answer = e.target.value; feedback = null; renderStatus(); save(); } });
  $('brand').addEventListener('click', showHome); $('home-button').addEventListener('click', showMap);
  $('sandbox-button').addEventListener('click', () => openLesson('sandbox')); $('reference-button').addEventListener('click', showReference);
  $('menu-button').addEventListener('click', showSettings); $('dialog-close').addEventListener('click', () => $('dialog').close());
  $('dialog').addEventListener('click', e => { if (e.target === $('dialog')) { const r = $('dialog').getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) $('dialog').close(); } });
  $('language-button').addEventListener('click', () => { stashInput(); state.language = state.language === 'ja' ? 'en' : 'ja'; render(); save(); });
  $('import-file').addEventListener('change', e => importData(e.target.files[0]));
  window.addEventListener('beforeunload', save);
  render();
})();
</script>
</body>
